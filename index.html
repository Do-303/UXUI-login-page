<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아집 회원가입</title>
<style>
  :root{--brand:#2f80ed;--text:#222;--sub:#757575;--line:#dcdcdc;--err:#e5484d;--ok:#1a9d5c;--bg:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:#f7f8fa}
  .wrap{max-width:400px;margin:0 auto;padding:40px 16px 60px;background:var(--bg);min-height:100vh}
  h1{font-size:28px;color:var(--brand);text-align:center;margin:0 0 6px}
  .lead{text-align:center;color:var(--sub);margin:0 0 28px;font-size:14px}
  .req-note{font-size:12px;color:var(--sub);text-align:right;margin:0 0 8px}
  .req-note b,.req{color:var(--err)}
  .field{margin-bottom:18px}
  label.lb{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
  .row{display:flex;gap:8px}
  .input{position:relative;flex:1}
  input[type=text],input[type=email],input[type=password]{width:100%;height:46px;padding:0 44px 0 12px;border:1px solid var(--line);border-radius:6px;font-size:15px;outline:none}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(47,128,237,.15)}
  .field.invalid input{border-color:var(--err)}
  .field.valid input{border-color:var(--ok)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;cursor:pointer;color:var(--sub);font-size:18px}
  .msg{min-height:18px;margin:6px 2px 0;font-size:12px;color:var(--sub)}
  .field.invalid .msg{color:var(--err)}
  .field.valid .msg{color:var(--ok)}
  .btn-sub{height:46px;padding:0 14px;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:6px;font-weight:600;cursor:pointer;white-space:nowrap}
  fieldset{border:0;padding:0;margin:26px 0 0}
  legend{font-size:14px;font-weight:600;padding:0;margin-bottom:8px}
  .terms{border:1px solid var(--line);border-radius:6px;padding:4px 14px}
  .t{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:14px}
  .t input{width:18px;height:18px;accent-color:var(--brand)}
  .t.all{font-weight:700;border-bottom:1px solid var(--line);padding:14px 0}
  .t .tag{color:var(--sub);font-size:12px;margin-left:auto}
  .t .tag.must{color:var(--brand)}
  .terms-err{font-size:12px;color:var(--err);min-height:18px;margin:6px 2px 0}
  .submit{width:100%;height:52px;margin-top:14px;border:0;border-radius:6px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;margin:32px 0 16px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .social{display:flex;justify-content:center;gap:14px}
  .social button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:15px}
  .kakao{background:#fee500}.naver{background:#03c75a;color:#fff}.apple{background:#000;color:#fff}.google{background:#fff;color:#444}
  .login{text-align:center;font-size:13px;color:var(--sub);margin-top:24px}
  .login a{color:var(--brand);font-weight:600}
</style>
</head>
<body>
<main class="wrap">
  <h1>모아집</h1>
  <p class="lead">이메일로 간단하게 가입해 보세요</p>

  <form id="form" novalidate>
    <p class="req-note"><b>*</b> 표시는 필수 입력 항목이에요</p>

    <div class="field" data-name="email">
      <label class="lb" for="email">이메일 <span class="req">*</span></label>
      <div class="input"><input id="email" type="email" autocomplete="email" placeholder="example@moajip.com"></div>
      <p class="msg" aria-live="polite"></p>
    </div>

    <div class="field" data-name="pw">
      <label class="lb" for="pw">비밀번호 <span class="req">*</span></label>
      <div class="input">
        <input id="pw" type="password" autocomplete="new-password" placeholder="8자 이상, 영문+숫자 포함">
        <button type="button" class="eye" data-target="pw" aria-label="비밀번호 보기" aria-pressed="false">👁</button>
      </div>
      <p class="msg" aria-live="polite">8자 이상, 영문과 숫자를 함께 사용해 주세요.</p>
    </div>

    <div class="field" data-name="pw2">
      <label class="lb" for="pw2">비밀번호 확인 <span class="req">*</span></label>
      <div class="input">
        <input id="pw2" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력">
        <button type="button" class="eye" data-target="pw2" aria-label="비밀번호 확인 보기" aria-pressed="false">👁</button>
      </div>
      <p class="msg" aria-live="polite"></p>
    </div>

    <div class="field" data-name="nick">
      <label class="lb" for="nick">닉네임 <span class="req">*</span></label>
      <div class="row">
        <div class="input"><input id="nick" type="text" maxlength="15" placeholder="2~15자"></div>
        <button type="button" class="btn-sub" id="nickCheck">중복확인</button>
      </div>
      <p class="msg" aria-live="polite"></p>
    </div>

    <fieldset>
      <legend>약관 동의</legend>
      <div class="terms">
        <label class="t all"><input type="checkbox" id="all"> 전체 동의</label>
        <label class="t"><input type="checkbox" class="term" data-req="1"> 만 14세 이상이에요 <span class="tag must">필수</span></label>
        <label class="t"><input type="checkbox" class="term" data-req="1"> 이용약관 <span class="tag must">필수</span></label>
        <label class="t"><input type="checkbox" class="term" data-req="1"> 개인정보 수집·이용 <span class="tag must">필수</span></label>
        <label class="t"><input type="checkbox" class="term"> 마케팅 활용 동의 <span class="tag">선택</span></label>
        <label class="t"><input type="checkbox" class="term"> 이벤트·쿠폰·특가 알림 <span class="tag">선택</span></label>
      </div>
      <p class="terms-err" id="termsErr" aria-live="polite"></p>
    </fieldset>

    <button class="submit" type="submit">회원가입 완료</button>
  </form>

  <!-- 간편 가입은 이메일 가입 아래로 이동, 사용량 적은 페이스북 등은 제거 -->
  <div class="divider">또는 간편 가입</div>
  <div class="social">
    <button class="kakao" aria-label="카카오로 가입">K</button>
    <button class="naver" aria-label="네이버로 가입">N</button>
    <button class="apple" aria-label="애플로 가입"></button>
    <button class="google" aria-label="구글로 가입">G</button>
  </div>

  <p class="login">이미 계정이 있나요? <a href="#">로그인</a></p>
</main>

<script>
const $ = s => document.querySelector(s);
const f = n => $(`.field[data-name="${n}"]`);
const val = id => $('#' + id).value;
let nickOk = false;
const touched = {}; // 사용자가 입력을 시작한 필드만 true

const rules = {
  email: () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email')) ? '' : '올바른 이메일 형식이 아니에요.',
  pw: () => /^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(val('pw')) ? '' : '8자 이상, 영문과 숫자를 함께 사용해 주세요.',
  pw2: () => val('pw2') === val('pw') ? '' : '비밀번호가 일치하지 않아요.',
  nick: () => {
    const v = val('nick').trim();
    if (v.length < 2) return '닉네임은 2자 이상이에요.';
    return nickOk ? '' : '닉네임 중복확인을 해 주세요.';
  }
};
const okText = { email: '', pw: '사용 가능한 비밀번호예요.', pw2: '비밀번호가 일치해요.', nick: '사용 가능한 닉네임이에요.' };
const hint = { pw: '8자 이상, 영문과 숫자를 함께 사용해 주세요.' };

function show(name, force) {
  const el = f(name), msg = el.querySelector('.msg');
  const empty = val(name === 'nick' ? 'nick' : name) === '';
  // 비어 있는 채로 포커스만 벗어난 경우엔 오류를 띄우지 않음 (제출 시에만)
  if (!force && (!touched[name] || empty)) { el.classList.remove('invalid', 'valid'); msg.textContent = hint[name] || ''; return true; }
  const err = empty ? '필수 입력 항목이에요.' : rules[name]();
  el.classList.toggle('invalid', !!err);
  el.classList.toggle('valid', !err);
  msg.textContent = err || okText[name];
  return !err;
}

// 각 입력창은 자기 자신만 검사한다
for (const n of ['email', 'pw', 'pw2', 'nick']) {
  const input = $('#' + n);
  input.addEventListener('input', () => {
    touched[n] = true;
    if (n === 'nick') nickOk = false;
    show(n);
    if (n === 'pw' && touched.pw2) show('pw2'); // 비번 변경 시, 확인창은 이미 입력했을 때만 재검사
  });
  input.addEventListener('blur', () => show(n)); // 값이 있을 때만 검사, 포커스 이동만으로는 빨갛게 안 됨
}

// 비밀번호 보기/숨기기
document.querySelectorAll('.eye').forEach(b => b.addEventListener('click', () => {
  const i = $('#' + b.dataset.target), show = i.type === 'password';
  i.type = show ? 'text' : 'password';
  b.textContent = show ? '🙈' : '👁';
  b.setAttribute('aria-pressed', show);
  b.setAttribute('aria-label', show ? '비밀번호 숨기기' : '비밀번호 보기');
}));

// 닉네임 중복확인: 닉네임 필드만 영향
$('#nickCheck').addEventListener('click', () => {
  touched.nick = true;
  const v = val('nick').trim(), el = f('nick'), msg = el.querySelector('.msg');
  if (v.length < 2) { nickOk = false; show('nick', true); return; }
  if (['admin', '관리자', 'moajip'].includes(v.toLowerCase())) {
    nickOk = false; el.classList.add('invalid'); el.classList.remove('valid'); msg.textContent = '이미 사용 중인 닉네임이에요.'; return;
  }
  nickOk = true; show('nick', true);
});

// 약관: 각 항목 독립 선택
const terms = [...document.querySelectorAll('.term')];
$('#all').addEventListener('change', e => { terms.forEach(t => t.checked = e.target.checked); $('#termsErr').textContent = ''; });
terms.forEach(t => t.addEventListener('change', () => {
  $('#all').checked = terms.every(x => x.checked); // 다른 항목은 건드리지 않음
  if (terms.filter(x => x.dataset.req).every(x => x.checked)) $('#termsErr').textContent = '';
}));

$('#form').addEventListener('submit', e => {
  e.preventDefault();
  let firstBad = null;
  for (const n of ['email', 'pw', 'pw2', 'nick']) { touched[n] = true; if (!show(n, true) && !firstBad) firstBad = n; }
  const termsOk = terms.filter(x => x.dataset.req).every(x => x.checked);
  $('#termsErr').textContent = termsOk ? '' : '필수 약관에 동의해 주세요.';
  if (firstBad) return $('#' + firstBad).focus();
  if (!termsOk) return;
  alert('가입이 완료되었어요! (데모)');
});
</script>
</body>
</html>
