<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모아집 회원가입</title>
<style>
  :root{--brand:#B5532F;--brand-d:#984323;--brand-bg:#FBEFE8;--text:#2B2623;--sub:#7A716B;--line:#E4DCD3;--err:#D92D20;--ok:#2E7D4F;--bg:#FAF6F0;--card:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--text);background:var(--bg)}
  .wrap{max-width:440px;margin:0 auto;padding:28px 20px 56px;min-height:100vh}
  .top{display:flex;align-items:center;justify-content:space-between;height:36px}
  .logo{font-size:22px;font-weight:800;color:var(--brand);letter-spacing:-.5px}
  .back{border:0;background:none;font-size:14px;color:var(--sub);cursor:pointer;padding:6px 0;width:44px;text-align:left}
  .back[hidden]{visibility:hidden;display:block}
  .steps{display:flex;gap:6px;margin:22px 0 6px;list-style:none;padding:0}
  .steps li{flex:1;font-size:12px;color:var(--sub)}
  .steps li::before{content:"";display:block;height:4px;border-radius:2px;background:var(--line);margin-bottom:6px}
  .steps li.on{color:var(--brand);font-weight:700}
  .steps li.on::before,.steps li.done::before{background:var(--brand)}
  .steps li.done{color:var(--text)}
  .card{background:var(--card);border-radius:16px;padding:28px 22px;margin-top:14px;box-shadow:0 2px 14px rgba(60,40,20,.06)}
  h1{font-size:22px;line-height:1.35;margin:0 0 6px}
  .lead{margin:0 0 22px;color:var(--sub);font-size:14px;line-height:1.5}
  section[hidden]{display:none}
  .quick{display:flex;gap:8px;margin-bottom:12px}
  .chip{flex:1;height:42px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:600;color:var(--text);cursor:pointer}
  .chip.primary{background:var(--brand-bg);border-color:var(--brand);color:var(--brand)}
  .chip:hover{border-color:var(--brand)}
  .terms{border:1px solid var(--line);border-radius:10px;padding:2px 14px}
  .t{display:flex;align-items:center;gap:10px;padding:12px 0;font-size:14px;cursor:pointer}
  .t input{width:20px;height:20px;accent-color:var(--brand);flex:none}
  .t.all{font-weight:700;border-bottom:1px solid var(--line);padding:14px 0;font-size:15px}
  .tag{margin-left:auto;font-size:12px;color:var(--sub)}
  .tag.must{color:var(--brand);font-weight:700}
  .view{font-size:12px;color:var(--sub);text-decoration:underline;margin-left:6px}
  .req-note{font-size:12px;color:var(--sub);text-align:right;margin:-8px 0 10px}
  .req,.req-note b{color:var(--err)}
  .field{margin-bottom:16px}
  label.lb{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
  .row{display:flex;gap:8px}
  .input{position:relative;flex:1}
  input[type=text],input[type=email],input[type=password]{width:100%;height:48px;padding:0 46px 0 14px;border:1px solid var(--line);border-radius:8px;font-size:15px;outline:none;background:#fff;color:var(--text)}
  input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(181,83,47,.15)}
  .field.invalid input{border-color:var(--err)}
  .field.valid input{border-color:var(--ok)}
  .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:none;cursor:pointer;color:var(--sub);display:grid;place-items:center}
  .eye svg{width:20px;height:20px}
  .msg{min-height:18px;margin:6px 2px 0;font-size:12px;color:var(--sub)}
  .field.invalid .msg{color:var(--err)}
  .field.valid .msg{color:var(--ok)}
  .btn-sub{height:48px;padding:0 14px;border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:8px;font-weight:700;cursor:pointer;white-space:nowrap}
  .cta{width:100%;height:54px;margin-top:8px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .cta:hover:not(:disabled){background:var(--brand-d)}
  .cta:disabled{background:#D9CFC6;cursor:not-allowed}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin:8px 0 0;min-height:18px}
  .divider{display:flex;align-items:center;gap:10px;color:var(--sub);font-size:13px;margin:26px 0 14px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
  .social{display:flex;justify-content:center;gap:12px}
  .social button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);cursor:pointer;font-weight:800;font-size:15px}
  .kakao{background:#fee500}.naver{background:#03c75a;color:#fff}.apple{background:#000;color:#fff}.google{background:#fff;color:#444}
  .login{text-align:center;font-size:13px;color:var(--sub);margin-top:22px}
  .login a{color:var(--brand);font-weight:700}
  .done-box{text-align:center;padding:12px 0}
  .badge{width:64px;height:64px;border-radius:50%;background:var(--brand-bg);color:var(--brand);display:grid;place-items:center;margin:0 auto 16px}
  .badge svg{width:30px;height:30px}
  .coupon{margin:18px 0;border:1px dashed var(--brand);border-radius:10px;padding:14px;background:var(--brand-bg);font-size:14px}
  .coupon b{color:var(--brand);font-size:18px;display:block;margin-top:2px}
</style>
</head>
<body>
<main class="wrap">
  <div class="top">
    <button class="back" id="back" type="button" hidden>← 이전</button>
    <span class="logo">모아집</span>
    <span style="width:44px"></span>
  </div>

  <ol class="steps" id="steps" aria-label="가입 단계">
    <li class="on">약관 동의</li><li>정보 입력</li><li>가입 완료</li>
  </ol>

  <div class="card">
    <!-- 1단계: 약관 동의 -->
    <section id="s1">
      <h1>모아집에 오신 걸 환영해요</h1>
      <p class="lead">가입을 위해 약관을 확인해 주세요.</p>
      <div class="quick">
        <button type="button" class="chip primary" id="reqOnly">필수 항목만 동의하기</button>
        <button type="button" class="chip" id="reset">선택 해제</button>
      </div>
      <div class="terms">
        <label class="t all"><input type="checkbox" id="all"> 전체 동의</label>
        <label class="t"><input type="checkbox" class="term" data-req="1"> 만 14세 이상이에요 <span class="tag must">필수</span></label>
        <label class="t"><input type="checkbox" class="term" data-req="1"> 이용약관 <a class="view" href="#">보기</a> <span class="tag must">필수</span></label>
        <label class="t"><input type="checkbox" class="term" data-req="1"> 개인정보 수집·이용 <a class="view" href="#">보기</a> <span class="tag must">필수</span></label>
        <label class="t"><input type="checkbox" class="term"> 마케팅 활용 동의 <span class="tag">선택</span></label>
        <label class="t"><input type="checkbox" class="term"> 이벤트·쿠폰·특가 알림 <span class="tag">선택</span></label>
      </div>
      <button class="cta" id="next1" type="button" disabled>다음</button>
      <p class="hint" id="hint1">필수 약관에 동의하면 다음으로 넘어갈 수 있어요.</p>

      <div class="divider">또는 간편 가입</div>
      <div class="social">
        <button class="kakao" aria-label="카카오로 가입">K</button>
        <button class="naver" aria-label="네이버로 가입">N</button>
        <button class="apple" aria-label="애플로 가입">A</button>
        <button class="google" aria-label="구글로 가입">G</button>
      </div>
      <p class="login">이미 계정이 있나요? <a href="#">로그인</a></p>
    </section>

    <!-- 2단계: 정보 입력 -->
    <section id="s2" hidden>
      <h1>계정 정보를 입력해 주세요</h1>
      <p class="lead">이메일과 비밀번호만 있으면 돼요.</p>
      <p class="req-note"><b>*</b> 표시는 필수 입력 항목이에요</p>
      <form id="form" novalidate>
        <div class="field" data-name="email">
          <label class="lb" for="email">이메일 <span class="req">*</span></label>
          <div class="input"><input id="email" type="email" autocomplete="email" placeholder="example@moajip.com"></div>
          <p class="msg" aria-live="polite"></p>
        </div>
        <div class="field" data-name="pw">
          <label class="lb" for="pw">비밀번호 <span class="req">*</span></label>
          <div class="input">
            <input id="pw" type="password" autocomplete="new-password" placeholder="8자 이상, 영문+숫자 포함">
            <button type="button" class="eye" data-target="pw" aria-label="비밀번호 보기" aria-pressed="false"></button>
          </div>
          <p class="msg" aria-live="polite">8자 이상, 영문과 숫자를 함께 사용해 주세요.</p>
        </div>
        <div class="field" data-name="pw2">
          <label class="lb" for="pw2">비밀번호 확인 <span class="req">*</span></label>
          <div class="input">
            <input id="pw2" type="password" autocomplete="new-password" placeholder="비밀번호를 한 번 더 입력">
            <button type="button" class="eye" data-target="pw2" aria-label="비밀번호 확인 보기" aria-pressed="false"></button>
          </div>
          <p class="msg" aria-live="polite"></p>
        </div>
        <div class="field" data-name="nick">
          <label class="lb" for="nick">닉네임 <span class="req">*</span></label>
          <div class="row">
            <div class="input"><input id="nick" type="text" maxlength="15" placeholder="2~15자"></div>
            <button type="button" class="btn-sub" id="nickCheck">중복확인</button>
          </div>
          <p class="msg" aria-live="polite"></p>
        </div>
        <button class="cta" type="submit">가입하기</button>
      </form>
    </section>

    <!-- 3단계: 완료 -->
    <section id="s3" hidden>
      <div class="done-box">
        <div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
        <h1><span id="who">회원</span>님, 가입이 끝났어요</h1>
        <p class="lead">모아집에서 마음에 드는 공간을 찾아보세요.</p>
        <div class="coupon">신규 가입 쿠폰이 도착했어요<b>10,000원</b></div>
        <button class="cta" type="button" onclick="location.reload()">쇼핑 시작하기</button>
      </div>
    </section>
  </div>
</main>

<script>
const $ = s => document.querySelector(s);
const f = n => $(`.field[data-name="${n}"]`);
const val = id => $('#' + id).value;
const EYE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/><path d="M3 3l18 18"/></svg>';
document.querySelectorAll('.eye').forEach(b => b.innerHTML = EYE);

/* 단계 이동 */
function go(n) {
  [1, 2, 3].forEach(i => $('#s' + i).hidden = i !== n);
  [...$('#steps').children].forEach((li, i) => { li.className = i + 1 < n ? 'done' : i + 1 === n ? 'on' : ''; });
  $('#back').hidden = n !== 2;
  window.scrollTo(0, 0);
}
$('#back').addEventListener('click', () => go(1));

/* 1단계: 약관 (항목끼리 서로 영향 없음) */
const terms = [...document.querySelectorAll('.term')];
const reqTerms = terms.filter(t => t.dataset.req);
function syncTerms() {
  $('#all').checked = terms.every(t => t.checked);
  const ok = reqTerms.every(t => t.checked);
  $('#next1').disabled = !ok;
  $('#hint1').textContent = ok ? '' : '필수 약관에 동의하면 다음으로 넘어갈 수 있어요.';
}
$('#all').addEventListener('change', e => { terms.forEach(t => t.checked = e.target.checked); syncTerms(); });
terms.forEach(t => t.addEventListener('change', syncTerms));
$('#reqOnly').addEventListener('click', () => { terms.forEach(t => t.checked = !!t.dataset.req); syncTerms(); });
$('#reset').addEventListener('click', () => { terms.forEach(t => t.checked = false); syncTerms(); });
document.querySelectorAll('.view').forEach(a => a.addEventListener('click', e => e.preventDefault()));
$('#next1').addEventListener('click', () => go(2));

/* 2단계: 입력 검증 */
let nickOk = false;
const touched = {};
const rules = {
  email: () => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('email')) ? '' : '올바른 이메일 형식이 아니에요.',
  pw: () => /^(?=.*[A-Za-z])(?=.*\d).{8,}$/.test(val('pw')) ? '' : '8자 이상, 영문과 숫자를 함께 사용해 주세요.',
  pw2: () => val('pw2') === val('pw') ? '' : '비밀번호가 일치하지 않아요.',
  nick: () => val('nick').trim().length < 2 ? '닉네임은 2자 이상이에요.' : nickOk ? '' : '닉네임 중복확인을 해 주세요.'
};
const okText = { email: '', pw: '사용 가능한 비밀번호예요.', pw2: '비밀번호가 일치해요.', nick: '사용 가능한 닉네임이에요.' };
const hint = { pw: '8자 이상, 영문과 숫자를 함께 사용해 주세요.' };

function show(name, force) {
  const el = f(name), msg = el.querySelector('.msg'), empty = val(name) === '';
  if (!force && (!touched[name] || empty)) { el.classList.remove('invalid', 'valid'); msg.textContent = hint[name] || ''; return true; }
  const err = empty ? '필수 입력 항목이에요.' : rules[name]();
  el.classList.toggle('invalid', !!err);
  el.classList.toggle('valid', !err);
  msg.textContent = err || okText[name];
  return !err;
}
for (const n of ['email', 'pw', 'pw2', 'nick']) {
  const input = $('#' + n);
  input.addEventListener('input', () => {
    touched[n] = true;
    if (n === 'nick') nickOk = false;
    show(n);
    if (n === 'pw' && touched.pw2) show('pw2');
  });
  input.addEventListener('blur', () => show(n));
}
document.querySelectorAll('.eye').forEach(b => b.addEventListener('click', () => {
  const i = $('#' + b.dataset.target), reveal = i.type === 'password';
  i.type = reveal ? 'text' : 'password';
  b.innerHTML = reveal ? EYE_OFF : EYE;
  b.setAttribute('aria-pressed', reveal);
  b.setAttribute('aria-label', reveal ? '비밀번호 숨기기' : '비밀번호 보기');
}));
$('#nickCheck').addEventListener('click', () => {
  touched.nick = true;
  const v = val('nick').trim(), el = f('nick'), msg = el.querySelector('.msg');
  if (v.length < 2) { nickOk = false; show('nick', true); return; }
  if (['admin', '관리자', 'moajip'].includes(v.toLowerCase())) {
    nickOk = false; el.classList.add('invalid'); el.classList.remove('valid'); msg.textContent = '이미 사용 중인 닉네임이에요.'; return;
  }
  nickOk = true; show('nick', true);
});
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  let firstBad = null;
  for (const n of ['email', 'pw', 'pw2', 'nick']) { touched[n] = true; if (!show(n, true) && !firstBad) firstBad = n; }
  if (firstBad) return $('#' + firstBad).focus();
  $('#who').textContent = val('nick').trim();
  go(3);
});
</script>
</body>
</html>
